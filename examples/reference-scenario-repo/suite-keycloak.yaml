apiVersion: spex.suite.v0.1
kind: ScenarioSuite
metadata:
  name: reference-device-acceptance-keycloak
spec:
  bindingRef: ../bindings/local-dev-keycloak.yaml
  integrationProfileRef: ../integration/local-kind-keycloak-profile.yaml
  catalogRefs:
    - ../catalogs/telemetry-flow.yaml
    - ../catalogs/telemetry-steps.yaml
  scenarios:
    - ../scenarios/**/*.yaml
    - ../features/**/*.feature
  workspaceDir: generated/reference-device-acceptance-keycloak
  failFast: false
  reports:
    outputDir: reports-keycloak
    format:
      - yaml
      - json
      - junit
