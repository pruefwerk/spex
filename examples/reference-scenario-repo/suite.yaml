apiVersion: spex.suite.v0.1
kind: ScenarioSuite
metadata:
  name: reference-device-acceptance
spec:
  bindingRef: ../bindings/local-dev.yaml
  catalogRefs:
    - ../catalogs/telemetry-flow.yaml
    - ../catalogs/telemetry-steps.yaml
  scenarios:
    - ../scenarios/**/*.yaml
    - ../features/**/*.feature
  workspaceDir: generated/reference-device-acceptance
  failFast: false
  reports:
    outputDir: reports
    format:
      - yaml
      - json
      - junit
