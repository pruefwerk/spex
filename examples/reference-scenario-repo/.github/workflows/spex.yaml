name: spex-reference

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      live:
        description: Run live kind proof
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: spex-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make -C examples/reference-scenario-repo ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spex-reference-reports
          path: |
            examples/reference-scenario-repo/reports/
            examples/reference-scenario-repo/generated/
          if-no-files-found: warn
          retention-days: 14

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install live proof tools
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSL -o /tmp/kubectl https://dl.k8s.io/release/v1.29.8/bin/linux/amd64/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.19.1-linux-amd64.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          go install github.com/kudobuilder/kuttl/cmd/kubectl-kuttl@v0.25.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make probe-image
      - run: make -C examples/reference-scenario-repo live
        env:
          SPEX_MQTT_USERNAME: tester
          SPEX_MQTT_PASSWORD: tester-password
          SPEX_GRAPHQL_KEYCLOAK_CLIENT_SECRET: graphql-client-secret
          SPEX_KEYCLOAK_ADMIN_PASSWORD: admin-password
      - name: Scrub live kubeconfigs
        if: always()
        run: find examples/reference-scenario-repo/generated/live -name kubeconfig -type f -delete
      - name: Scan live artifacts for secret values
        if: always()
        run: go run ./cmd/spex doctor --skip-host-tools --scan-artifacts examples/reference-scenario-repo/generated/live --format json
        env:
          SPEX_MQTT_PASSWORD: tester-password
          SPEX_GRAPHQL_KEYCLOAK_CLIENT_SECRET: graphql-client-secret
          SPEX_KEYCLOAK_ADMIN_PASSWORD: admin-password
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spex-reference-live
          path: examples/reference-scenario-repo/generated/live/
          if-no-files-found: warn
          retention-days: 14
