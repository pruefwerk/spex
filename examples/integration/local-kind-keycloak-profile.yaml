apiVersion: spex.integration.v0.1
kind: IntegrationProfile
spec:
  kind:
    start: true
    clusterName: kind
    config: local-kind.yaml
    nodeCache: false
    commands:
      - command: docker build -f ${repoRoot}/examples/integration/probe/Dockerfile -t ${probeImage} ${repoRoot}
        timeout: 300
      - command: docker build -f ${repoRoot}/examples/integration/demo-stack/Dockerfile -t spex-demo-stack:dev ${repoRoot}
        timeout: 300
      - command: kind load docker-image ${probeImage} --name ${kindCluster}
        timeout: 300
      - command: kind load docker-image spex-demo-stack:dev --name ${kindCluster}
        timeout: 300
      - command: kind load docker-image keycloak/keycloak:26.0.7 --name ${kindCluster}
        timeout: 300
  setup:
    commands:
      - command: >
          kubectl ${kubeContextArgs} create namespace ${namespace}
          --dry-run=client -o yaml | kubectl ${kubeContextArgs} apply -f -
        timeout: 60
      - command: >
          set -eu;
          test -n "$SPEX_KEYCLOAK_ADMIN_PASSWORD";
          kubectl ${kubeContextArgs} create namespace identity
          --dry-run=client -o yaml | kubectl ${kubeContextArgs} apply -f -;
          kubectl ${kubeContextArgs} -n identity create secret generic keycloak-admin
          --from-literal=username=admin
          --from-literal=password="$SPEX_KEYCLOAK_ADMIN_PASSWORD"
          --dry-run=client -o yaml | kubectl ${kubeContextArgs} apply -f -
        timeout: 60
      - command: >
          kubectl ${kubeContextArgs} apply -f
          ${repoRoot}/examples/integration/manifests/local-kind-services.yaml;
          kubectl ${kubeContextArgs} apply -f
          ${repoRoot}/examples/integration/manifests/keycloak.yaml;
          kubectl ${kubeContextArgs} -n application set env deployment/graphql-api GRAPHQL_REQUIRE_AUTH=true
        timeout: 120
      - command: >
          kubectl ${kubeContextArgs} -n platform rollout status deployment/emqx --timeout=300s;
          kubectl ${kubeContextArgs} -n streaming rollout status deployment/redpanda --timeout=300s;
          kubectl ${kubeContextArgs} -n application rollout status deployment/spex-demo-ingestor --timeout=300s;
          kubectl ${kubeContextArgs} -n application rollout status deployment/graphql-api --timeout=300s;
          kubectl ${kubeContextArgs} -n identity rollout status deployment/keycloak --timeout=300s
        timeout: 300
      - command: >
          set -eu;
          test -n "$SPEX_KEYCLOAK_ADMIN_PASSWORD";
          test -n "$SPEX_GRAPHQL_KEYCLOAK_CLIENT_SECRET";
          kubectl ${kubeContextArgs} -n identity exec deployment/keycloak --
          /bin/sh -c "/opt/keycloak/bin/kcadm.sh config credentials --server http://127.0.0.1:8080 --realm master --user admin --password \"$SPEX_KEYCLOAK_ADMIN_PASSWORD\" &&
          (/opt/keycloak/bin/kcadm.sh get realms/dev >/dev/null 2>&1 || /opt/keycloak/bin/kcadm.sh create realms -s realm=dev -s enabled=true) &&
          (/opt/keycloak/bin/kcadm.sh get clients -r dev -q clientId=spex | grep -q '\"clientId\" : \"spex\"' || /opt/keycloak/bin/kcadm.sh create clients -r dev -s clientId=spex -s enabled=true -s serviceAccountsEnabled=true -s clientAuthenticatorType=client-secret -s secret=\"$SPEX_GRAPHQL_KEYCLOAK_CLIENT_SECRET\")"
        timeout: 120
      - command: >
          set -eu;
          test -n "$SPEX_MQTT_USERNAME";
          test -n "$SPEX_MQTT_PASSWORD";
          kubectl ${kubeContextArgs} -n ${namespace} create secret generic mqtt-probe-credentials
          --from-literal=username="$SPEX_MQTT_USERNAME"
          --from-literal=password="$SPEX_MQTT_PASSWORD"
          --dry-run=client -o yaml | kubectl ${kubeContextArgs} apply -f -
        timeout: 60
      - command: >
          set -eu;
          test -n "$SPEX_GRAPHQL_KEYCLOAK_CLIENT_SECRET";
          kubectl ${kubeContextArgs} -n ${namespace} create secret generic keycloak-client-credentials
          --from-literal=client-secret="$SPEX_GRAPHQL_KEYCLOAK_CLIENT_SECRET"
          --dry-run=client -o yaml | kubectl ${kubeContextArgs} apply -f -
        timeout: 60
