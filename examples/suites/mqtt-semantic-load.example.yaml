apiVersion: spex.suite.v0.1
kind: ScenarioSuite
metadata:
  name: mqtt-semantic-load
spec:
  bindingRef: ../bindings/local-dev.yaml
  scenarios:
    - ../scenarios/mqtt-ingestion-basic.yaml
  execution:
    repetitions: 100
    concurrency: 10
    rateLimit:
      perSecond: 25
    failFast: false
    maxFailures: 10
  workspaceDir: ../generated/mqtt-semantic-load
  failFast: false
