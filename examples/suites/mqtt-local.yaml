apiVersion: spex.suite.v0.1
kind: ScenarioSuite
metadata:
  name: mqtt-local
spec:
  bindingRef: ../bindings/local-dev.yaml
  catalogRefs:
    - ../catalogs/telemetry-flow.yaml
    - ../catalogs/telemetry-steps.yaml
  scenarios:
    - ../scenarios/**/*.yaml
    - path: ../features/**/*.feature
      tags:
        - regression
      parameters:
        deviceId: device-dev-1
  workspaceDir: ../../generated/suites/mqtt-local
  failFast: false
  reports:
    outputDir: ../../generated/suites/mqtt-local/reports
    format:
      - yaml
      - json
      - junit
