apiVersion: spex.suite.v0.1
kind: ScenarioSuite
metadata:
  name: mqtt-external-binding
spec:
  # bindingRef may point outside the scenario repository. Use an absolute path
  # or a relative path such as ../../platform-test-targets/bindings/dev.yaml.
  bindingRef: ../../platform-test-targets/bindings/dev.yaml
  catalogRefs:
    - ../catalogs/telemetry-flow.yaml
    - ../catalogs/telemetry-steps.yaml
  scenarios:
    - ../scenarios/**/*.yaml
  workspaceDir: ../../generated/suites/mqtt-external-binding
  failFast: false
