apiVersion: spex.suite.v0.1
kind: ScenarioSuite
metadata:
  name: mqtt-git-refs
spec:
  # Explicit Git URL form. Works with GitHub Enterprise, GitLab, Bitbucket,
  # SSH, HTTPS, and file:// repos.
  bindingRef: git::https://github.com.example/platform-test-targets.git//bindings/dev.yaml@v1.2.3
  integrationProfileRef: git::https://github.com.example/platform-test-targets.git//integration/local-kind.yaml@v1.2.3

  # GitHub Actions-style shorthand is also supported for GitHub-like hosts:
  # bindingRef: platform-team/platform-test-targets/bindings/dev.yaml@v1.2.3
  #
  # Set SPEX_GIT_REF_BASE_URL for enterprise hosts, for example:
  # SPEX_GIT_REF_BASE_URL=https://github.example.com

  catalogRefs:
    - git::https://github.com.example/platform-test-catalogs.git//telemetry-flow.yaml@v1.2.3
    - git::https://github.com.example/platform-test-catalogs.git//telemetry-steps.yaml@v1.2.3

  scenarios:
    - ../scenarios/**/*.yaml
  workspaceDir: ../../generated/suites/mqtt-git-refs
  failFast: false
