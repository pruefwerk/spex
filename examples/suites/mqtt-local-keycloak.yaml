apiVersion: spex.suite.v0.1
kind: ScenarioSuite
metadata:
  name: mqtt-local-keycloak
spec:
  bindingRef: ../bindings/local-dev-keycloak.yaml
  integrationProfileRef: ../integration/local-kind-keycloak-profile.yaml
  catalogRefs:
    - ../catalogs/telemetry-flow.yaml
    - ../catalogs/telemetry-steps.yaml
  scenarios:
    - ../scenarios/**/*.yaml
    - ../features/**/*.feature
  workspaceDir: ../../generated/suites/mqtt-local-keycloak
  failFast: false
  reports:
    outputDir: ../../generated/suites/mqtt-local-keycloak/reports
    format:
      - yaml
      - json
      - junit
