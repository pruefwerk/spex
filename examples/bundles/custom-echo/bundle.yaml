apiVersion: spex.bundle.v0.1
kind: IntegrationBundle
metadata:
  name: custom
  version: 0.1.0
spec:
  capabilities:
    - type: custom.echo
      bindingKind: custom.connection
      inputSchema:
        path: schemas/custom-echo-input.schema.yaml
      resultSchema:
        path: schemas/custom-echo-result.schema.yaml
      probe:
        image: ghcr.io/pruefwerk/spex-probe-custom-echo:0.1.0
        command:
          - custom-probe
          - run
        input:
          mode: operationFile
          path: /spex/input/operation.json
        output:
          path: /spex/output/result.json
  bindingSchemas:
    - kind: custom.connection
      schema:
        path: schemas/custom-connection.schema.yaml
  stepCatalogs:
    - catalogs/custom-echo-steps.yaml
