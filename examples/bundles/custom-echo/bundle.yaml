apiVersion: spex.bundle.v0.1
kind: IntegrationBundle
metadata:
  name: custom
  version: 0.1.0
spec:
  capabilities:
    - type: custom.echo
      bindingKind: custom.connection
      inputSchema:
        schema:
          type: object
          required:
            - message
          properties:
            message:
              type: string
      resultSchema:
        schema:
          type: object
          properties:
            echoed:
              type: string
      probe:
        image: ghcr.io/pruefwerk/spex-probe-custom-echo:0.1.0
        command:
          - custom-probe
          - run
        input:
          mode: operationFile
          path: /spex/input/operation.json
        output:
          path: /spex/output/result.json
  bindingSchemas:
    - kind: custom.connection
      schema:
        schema:
          type: object
          required:
            - endpoint
          properties:
            endpoint:
              type: string
