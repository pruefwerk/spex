apiVersion: spex.binding.v0.1
kind: TargetBinding
metadata:
  name: custom-local
spec:
  namespace: spex-test
  rbac:
    create: true
  probe:
    image: spex-probe:dev
    imagePullPolicy: IfNotPresent
    serviceAccountName: spex-probe
  secrets: {}
  bindings:
    - name: custom.main
      kind: custom.connection
      with:
        endpoint: http://custom.default.svc.cluster.local
